[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["xiaopengs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
cpal = "0.15"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
