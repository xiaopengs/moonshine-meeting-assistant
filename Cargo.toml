[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["xiaopengs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
cpal = "0.15"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
