[package]
name = "moonshine-core"
description = "Moonshine 会议助手核心库：音频采集 / 多引擎可插拔转写 / VAD / 说话人分离 / 摘要 / 导出"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows WASAPI 回环采集（cpal 不支持 loopback，必须直接调 COM）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
cpal = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
