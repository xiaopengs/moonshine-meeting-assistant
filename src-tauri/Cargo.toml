[package]
name = "moonshine-meeting-assistant"
description = "Moonshine 本地 AI 会议助手（Tauri 2 壳）"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "moonshine-meeting-assistant"

[lib]
name = "moonshine_meeting_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
moonshine-core = { path = "../crates/core" }
